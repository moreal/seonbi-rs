[tools]
node = "22.22.0"
deno = "2.6.9"
bun = "1.3.9"
python = "3.14"

[env]
SEONBI_ORIGINAL_BIN = ".tools/original/seonbi-0.5.0/seonbi"
SEONBI_ORIGINAL_API_BIN = ".tools/original/seonbi-0.5.0/seonbi-api"
SEONBI_ORIGINAL_API_URL = "http://127.0.0.1:3800"

[tasks.node-deps]
description = "Install Node binding dependencies"
run = "cd crates/seonbi-node && npm install"

[tasks.node-build]
description = "Build host N-API module for Node bindings"
depends = ["node-deps"]
run = [
  "cargo check -p seonbi-node",
  "cd crates/seonbi-node && npx napi build --release --platform",
]

[tasks.test-node]
description = "Run Node runtime tests"
depends = ["node-build"]
run = "node --test crates/seonbi-node/__tests__/index.spec.mjs"

[tasks.test-bun]
description = "Run Bun runtime smoke test"
depends = ["node-build"]
run = "bun run crates/seonbi-node/__tests__/runtime-smoke.mjs"

[tasks.test-deno]
description = "Run Deno runtime smoke test"
depends = ["node-build"]
run = "deno run -A --unstable-detect-cjs --node-modules-dir=auto crates/seonbi-node/__tests__/runtime-smoke.mjs"

[tasks.wasm-build]
description = "Build wasm package"
run = "wasm-pack build crates/seonbi-wasm --release --target web --scope seonbi"

[tasks.test-wasm]
description = "Run wasm build and tests (headless Chrome)"
run = [
  "wasm-pack build crates/seonbi-wasm --release --target web --scope seonbi",
  "cargo test -p seonbi-wasm",
  "wasm-pack test --headless --chrome crates/seonbi-wasm",
]

[tasks.python-deps]
description = "Install Python binding build/test tools"
run = "python -m pip install --upgrade pip maturin pytest"

[tasks.python-build]
description = "Build Python wheel for local testing"
depends = ["python-deps"]
run = "maturin build --release --manifest-path crates/seonbi-python/Cargo.toml --out crates/seonbi-python/dist"

[tasks.test-python]
description = "Run Python binding tests"
depends = ["python-build"]
run = """
set -euo pipefail
wheel="$(ls -t crates/seonbi-python/dist/seonbi-*.whl | head -n1)"
python -m pip install --force-reinstall "$wheel"
pytest crates/seonbi-python/tests
"""

[tasks.test-js-all]
description = "Run all JS runtime tests (Node, Bun, Deno)"
depends = ["test-node", "test-bun", "test-deno"]
run = "echo JS runtime tests completed"

[tasks.test-bindings-all]
description = "Run all local binding tests (JS runtimes + wasm + python)"
depends = ["test-js-all", "test-wasm", "test-python"]
run = "echo All binding tests completed"

[tasks.e2e-cli-original]
description = "Run CLI original-vs-ported E2E comparison using .tools binaries"
run = """
set -euo pipefail
orig_bin="$SEONBI_ORIGINAL_BIN"
if [[ "$orig_bin" != /* ]]; then
  orig_bin="$(git rev-parse --show-toplevel)/$orig_bin"
fi
SEONBI_ORIGINAL_BIN="$orig_bin" \
  cargo test -p seonbi-cli --test e2e_compare -- --nocapture
"""

[tasks.e2e-api-original]
description = "Run API original-vs-ported E2E comparison using .tools binaries"
run = """
set -euo pipefail
orig_api="$SEONBI_ORIGINAL_API_BIN"
if [[ "$orig_api" != /* ]]; then
  orig_api="$(git rev-parse --show-toplevel)/$orig_api"
fi
port="${SEONBI_ORIGINAL_API_URL##*:}"
port="${port%%/*}"
"$orig_api" --host 127.0.0.1 --port "$port" >/tmp/seonbi-original-api.log 2>&1 &
orig_pid=$!
cleanup() {
  kill "$orig_pid" >/dev/null 2>&1 || true
  wait "$orig_pid" >/dev/null 2>&1 || true
}
trap cleanup EXIT
sleep 0.3
cargo test -p seonbi-api --test e2e compares_with_original_when_configured -- --nocapture
"""

[tasks.e2e-original-all]
description = "Run both CLI/API original-vs-ported E2E comparisons"
depends = ["e2e-cli-original", "e2e-api-original"]
run = "echo Original comparison E2E tests completed"
