<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="24 19 67 52"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="rustGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2a14"/>
      <stop offset="0.4" stop-color="#a24a21"/>
      <stop offset="0.75" stop-color="#d07a2f"/>
      <stop offset="1" stop-color="#6b2f16"/>
    </linearGradient>

    <!-- Noise strictly clipped to SourceAlpha (prevents any noisy box) -->
    <filter id="rustTextureClipped" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="1 0 0 0 0
                0 .6 0 0 0
                0 0 .25 0 0
                0 0 0 .75 0"
        result="coloredNoise"/>
      <feComposite in="coloredNoise" in2="SourceAlpha" operator="in" result="noiseInShape"/>
      <feBlend in="SourceGraphic" in2="noiseInShape" mode="multiply"/>
    </filter>

    <filter id="softShadow" color-interpolation-filters="sRGB">
      <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="rotate(14 55 48)" filter="url(#softShadow)">
    <g fill="none" stroke="#ffffff">
      <ellipse cx="58" cy="49" rx="30" ry="10" stroke-width="2.8"/>
      <path d="M47.1 45
               L47.1 30
               C47.1 26.5 49.9 24 53.3 24
               L62.7 24
               C66.1 24 68.9 26.5 68.9 30
               L68.9 45"
        stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M52.6 46.5 L52.6 42.8"
        stroke-width="2.7" stroke-linecap="round"/>
      <path d="M47 56 C46 58.2 46.4 60.8 48.7 62 C51.3 63.4 52.8 61.2 52 59"
        stroke-width="2.6" stroke-linecap="round"/>
      <path d="M62 56 C61 58.2 61.4 60.8 63.7 62 C66.3 63.4 67.8 61.2 67 59"
        stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Brim -->
    <ellipse cx="58" cy="49" rx="30" ry="10"
      fill="url(#rustGrad)"
      stroke="#2a1209" stroke-width="1.6"
      filter="url(#rustTextureClipped)"/>

    <!-- Under-brim -->
    <ellipse cx="58" cy="50.6" rx="25.5" ry="7.2"
      fill="#7a3a1b" opacity="0.35"/>

    <!-- Crown (fill) - centered -->
    <path d="M47.1 30
             C47.1 26.5 49.9 24 53.3 24
             L62.7 24
             C66.1 24 68.9 26.5 68.9 30
             L68.9 45
             C68.9 47.6 66.9 49.4 64.3 49.7
             L51.9 49.7
             C49.3 49.4 47.1 47.6 47.1 45
             Z"
      fill="url(#rustGrad)"
      filter="url(#rustTextureClipped)"/>

    <!-- Crown stroke WITHOUT bottom edge (top + sides only) -->
    <path d="M47.1 45
             L47.1 30
             C47.1 26.5 49.9 24 53.3 24
             L62.7 24
             C66.1 24 68.9 26.5 68.9 30
             L68.9 45"
      fill="none"
      stroke="#2a1209" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- notch -->
    <path d="M52.6 46.5 L52.6 42.8"
      stroke="#2a1209" stroke-width="1.5" stroke-linecap="round"/>

    <!-- straps -->
    <path d="M47 56 C46 58.2 46.4 60.8 48.7 62 C51.3 63.4 52.8 61.2 52 59"
      fill="none" stroke="#2a1209" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M62 56 C61 58.2 61.4 60.8 63.7 62 C66.3 63.4 67.8 61.2 67 59"
      fill="none" stroke="#2a1209" stroke-width="1.4" stroke-linecap="round"/>

    <!-- freckles -->
    <g opacity="0.55">
      <circle cx="49.2" cy="48" r="0.9" fill="#3a1a0d"/>
      <circle cx="55.2" cy="54" r="0.8" fill="#3a1a0d"/>
      <circle cx="64" cy="46" r="0.7" fill="#3a1a0d"/>
      <circle cx="72" cy="50" r="0.9" fill="#3a1a0d"/>
      <circle cx="60" cy="40" r="0.75" fill="#3a1a0d"/>
      <circle cx="66" cy="36" r="0.65" fill="#3a1a0d"/>
    </g>
  </g>
</svg>
