[workspace]
members = ["crates/seonbi", "crates/seonbi-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LGPL-2.1"

[workspace.dependencies]
nom = "8.0"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "22.0"
csv = "1.4"
thiserror = "2.0"
html-escape = "0.2"
htmlentity = "1.3"
pretty_assertions = "1.4"
clap = { version = "4.5", features = ["derive"] }
