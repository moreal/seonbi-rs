[package]
name = "seonbi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Korean text arrow/quote/punctuation processor"
repository = "https://github.com/moreal/seonbi-rs"
readme = "README.md"

[features]
default = ["freeze-dict"]
freeze-dict = []

[dependencies]
nom.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
pulldown-cmark-to-cmark.workspace = true
csv.workspace = true
thiserror.workspace = true
html-escape.workspace = true
htmlentity.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
