[package]
name = "seonbi-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "_seonbi"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module"] }
seonbi = { path = "../seonbi" }

[build-dependencies]
pyo3-build-config = "0.28"
