name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_VERSION: '3.14'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude node --exclude wasm --exclude python

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace --exclude node --exclude wasm --exclude python

  build-wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build wasm package
        run: wasm-pack build crates/wasm --release --target web --scope seonbi
      - name: Run Rust unit tests
        run: cargo test -p wasm
      - name: Run browser wasm tests
        run: wasm-pack test --headless --chrome crates/wasm

  build-node:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            run_runtime_tests: true
          - target: aarch64-apple-darwin
            os: macos-15
            run_runtime_tests: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run_runtime_tests: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            run_runtime_tests: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run_runtime_tests: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            run_runtime_tests: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux cross-compilers
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Zig for musl cross-compilation
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Check Rust crate
        run: cargo check -p node
      - name: Build N-API module (default targets)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npx napi build --release --platform --target ${{ matrix.target }}
      - name: Build N-API module (musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        run: npx napi build --release --platform --target ${{ matrix.target }} --cross-compile
      - name: Run Node runtime tests
        if: matrix.run_runtime_tests
        working-directory: crates/node
        run: node --test __tests__/index.spec.mjs

  test-bun:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Build host N-API module
        working-directory: crates/node
        run: npx napi build --release --platform
      - name: Run Bun runtime smoke test
        run: bun run crates/node/__tests__/runtime-smoke.mjs

  test-deno:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Build host N-API module
        working-directory: crates/node
        run: npx napi build --release --platform
      - name: Run Deno runtime smoke test
        run: deno run -A --unstable-detect-cjs --node-modules-dir=auto crates/node/__tests__/runtime-smoke.mjs

  build-python-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          python-version: ${{ env.PYTHON_VERSION }}
          manylinux: 2_28
          args: --release --manifest-path crates/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-linux-${{ matrix.target }}
          path: dist

  build-python-macos:
    needs: test
    runs-on: macos-15
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          python-version: ${{ env.PYTHON_VERSION }}
          args: --release --manifest-path crates/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-macos-${{ matrix.target }}
          path: dist

  build-python-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          python-version: ${{ env.PYTHON_VERSION }}
          args: --release --manifest-path crates/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-windows-x64
          path: dist

  test-python:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build/test tools
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build wheel
        run: maturin build --release --manifest-path crates/python/Cargo.toml --out dist
      - name: Install wheel
        run: python -m pip install dist/seonbi-*.whl
      - name: Run tests
        run: pytest crates/python/tests
