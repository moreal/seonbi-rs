name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

env:
  PYTHON_VERSION: '3.14'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude node --exclude wasm --exclude python

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace --exclude node --exclude wasm --exclude python

  e2e-original:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v3
      - name: Download original seonbi binaries
        run: bash scripts/download-seonbi.sh
      - name: Run original comparison E2E tests
        run: mise run --jobs 1 e2e-original-all
      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: proptest-regressions-e2e-original
          path: crates/seonbi-cli/proptest-regressions/**
          if-no-files-found: ignore

  build-wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build wasm package
        run: wasm-pack build crates/wasm --release --target web --scope seonbi
      - name: Run Rust unit tests
        run: cargo test -p wasm
      - name: Run browser wasm tests
        run: wasm-pack test --headless --chrome crates/wasm

  build-node:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            run_runtime_tests: true
          - target: aarch64-apple-darwin
            os: macos-15
            run_runtime_tests: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run_runtime_tests: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            run_runtime_tests: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run_runtime_tests: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            run_runtime_tests: false
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Linux cross-compilers
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Zig for musl cross-compilation
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Check Rust crate
        run: cargo check -p node
      - name: Build N-API module (default targets)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npx napi build --release --platform --no-const-enum --target ${{ matrix.target }}
      - name: Build N-API module (musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        run: npx napi build --release --platform --no-const-enum --target ${{ matrix.target }} --cross-compile
      - name: Run Node runtime tests
        if: matrix.run_runtime_tests
        working-directory: crates/node
        run: node --test __tests__/index.spec.mjs
      - name: Upload node binding artifact
        uses: actions/upload-artifact@v6
        with:
          name: node-bindings-${{ matrix.target }}
          path: crates/node/seonbi.*.node
          if-no-files-found: error
      - name: Upload node JS bindings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v6
        with:
          name: node-js-bindings
          path: |
            crates/node/index.d.ts
            crates/node/index.js
          if-no-files-found: error

  test-bun:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Build host N-API module
        working-directory: crates/node
        run: npx napi build --release --platform --no-const-enum
      - name: Run Bun runtime smoke test
        run: bun run crates/node/__tests__/runtime-smoke.mjs

  test-deno:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Build host N-API module
        working-directory: crates/node
        run: npx napi build --release --platform --no-const-enum
      - name: Run Deno runtime smoke test
        run: deno run -A --unstable-detect-cjs --node-modules-dir=auto crates/node/__tests__/runtime-smoke.mjs

  build-python-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Convert version to PEP 440
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PEP440=$(echo "$TAG" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')
          sed -i "s/^version = .*/version = \"$PEP440\"/" crates/python/pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          python-version: ${{ env.PYTHON_VERSION }}
          manylinux: 2_28
          args: --release --manifest-path crates/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-wheels-linux-${{ matrix.target }}
          path: dist

  build-python-macos:
    needs: test
    runs-on: macos-15
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Convert version to PEP 440
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PEP440=$(echo "$TAG" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')
          sed -i "" "s/^version = .*/version = \"$PEP440\"/" crates/python/pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          python-version: ${{ env.PYTHON_VERSION }}
          args: --release --manifest-path crates/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-wheels-macos-${{ matrix.target }}
          path: dist

  build-python-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Convert version to PEP 440
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $pep440 = $tag -replace '-alpha\.', 'a' -replace '-beta\.', 'b' -replace '-rc\.', 'rc'
          (Get-Content crates/python/pyproject.toml) -replace '^version = .*', "version = `"$pep440`"" | Set-Content crates/python/pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          python-version: ${{ env.PYTHON_VERSION }}
          args: --release --manifest-path crates/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-wheels-windows-x64
          path: dist

  test-python:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build/test tools
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build wheel
        run: maturin build --release --manifest-path crates/python/Cargo.toml --out dist
      - name: Install wheel
        run: python -m pip install dist/seonbi-*.whl
      - name: Run tests
        run: pytest crates/python/tests

  ci-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - e2e-original
      - build-wasm
      - build-node
      - test-bun
      - test-deno
      - test-python
      - build-python-linux
      - build-python-macos
      - build-python-windows
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed"

  publish-crate:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Set crate version from git tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/seonbi/Cargo.toml
          grep '^version = ' crates/seonbi/Cargo.toml
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        run: cargo publish -p seonbi --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-node:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: jdx/mise-action@v3
      - name: Set version from git tag
        working-directory: crates/node
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version
      - name: Download all node binding artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: node-bindings-*
          path: crates/node/artifacts
          merge-multiple: true
      - name: Download JS bindings (index.d.ts, index.js)
        uses: actions/download-artifact@v7
        with:
          name: node-js-bindings
          path: crates/node
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Create platform package directories
        working-directory: crates/node
        run: npx napi create-npm-dirs
      - name: Collect node artifacts into platform packages
        working-directory: crates/node
        run: npx napi artifacts
      - name: Prepare npm packages
        working-directory: crates/node
        run: npx napi prepublish -t npm --no-gh-release --skip-optional-publish
      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG" == *-alpha.* ]]; then echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-beta.* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-rc.* ]]; then echo "tag=rc" >> "$GITHUB_OUTPUT"
          else echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish main package
        working-directory: crates/node
        run: npm publish --ignore-scripts --access public --tag ${{ steps.npm-tag.outputs.tag }}
      - name: Publish platform packages
        working-directory: crates/node
        run: |
          shopt -s nullglob
          platform_dirs=(npm/*/)
          if (( ${#platform_dirs[@]} == 0 )); then
            echo "No platform packages found under crates/node/npm; skipping."
            exit 0
          fi

          for dir in "${platform_dirs[@]}"; do
            cd "$dir"
            npm publish --ignore-scripts --access public --tag ${{ steps.npm-tag.outputs.tag }}
            cd ../..
          done

  publish-wasm:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jdx/mise-action@v3
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build wasm package
        run: wasm-pack build crates/wasm --release --target web --scope seonbi
      - name: Set version from git tag
        working-directory: crates/wasm/pkg
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version
      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG" == *-alpha.* ]]; then echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-beta.* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-rc.* ]]; then echo "tag=rc" >> "$GITHUB_OUTPUT"
          else echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish wasm package
        working-directory: crates/wasm/pkg
        run: npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }}

  publish-python:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive dist/*
