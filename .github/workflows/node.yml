name: Node Bindings

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        working-directory: crates/seonbi-node
        run: npm install
      - name: Check Rust crate
        run: cargo check -p seonbi-node
      - name: Build N-API module
        working-directory: crates/seonbi-node
        run: npx napi build --release --platform
      - name: Run Node runtime tests
        working-directory: crates/seonbi-node
        run: node --test __tests__/index.spec.mjs
