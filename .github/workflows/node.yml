name: Node Bindings

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            run_runtime_tests: true
          - target: aarch64-apple-darwin
            os: macos-15
            run_runtime_tests: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run_runtime_tests: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            run_runtime_tests: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run_runtime_tests: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            run_runtime_tests: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux cross-compilers
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Zig for musl cross-compilation
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Check Rust crate
        run: cargo check -p node
      - name: Build N-API module (default targets)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npx napi build --release --platform --target ${{ matrix.target }}
      - name: Build N-API module (musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        run: npx napi build --release --platform --target ${{ matrix.target }} --cross-compile
      - name: Run Node runtime tests
        if: matrix.run_runtime_tests
        working-directory: crates/node
        run: node --test __tests__/index.spec.mjs

  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Build host N-API module
        working-directory: crates/node
        run: npx napi build --release --platform
      - name: Run Bun runtime smoke test
        run: bun run crates/node/__tests__/runtime-smoke.mjs

  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Build host N-API module
        working-directory: crates/node
        run: npx napi build --release --platform
      - name: Run Deno runtime smoke test
        run: deno run -A --unstable-detect-cjs --node-modules-dir=auto crates/node/__tests__/runtime-smoke.mjs
