name: Python Bindings

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-python-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --manifest-path crates/seonbi-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-linux-${{ matrix.target }}
          path: dist

  build-python-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --manifest-path crates/seonbi-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-macos-${{ matrix.target }}
          path: dist

  build-python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/seonbi-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-windows-x64
          path: dist

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build/test tools
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build wheel
        run: maturin build --release --manifest-path crates/seonbi-python/Cargo.toml --out dist
      - name: Install wheel
        run: python -m pip install dist/seonbi-*.whl
      - name: Run tests
        run: pytest crates/seonbi-python/tests
