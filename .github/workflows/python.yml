name: Python Bindings

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/seonbi-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: dist

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build/test tools
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build wheel
        run: maturin build --release --manifest-path crates/seonbi-python/Cargo.toml --out dist
      - name: Install wheel
        run: python -m pip install dist/seonbi-*.whl
      - name: Run tests
        run: pytest crates/seonbi-python/tests
