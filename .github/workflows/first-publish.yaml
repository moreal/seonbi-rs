name: First Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0-alpha.0)'
        required: true
        type: string

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Set crate version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" crates/seonbi/Cargo.toml
          grep '^version = ' crates/seonbi/Cargo.toml
      - name: Publish to crates.io
        run: cargo publish -p seonbi --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Linux cross-compilers
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Zig for musl cross-compilation
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Build N-API module (default targets)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npx napi build --release --platform --target ${{ matrix.target }}
      - name: Build N-API module (musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: crates/node
        run: npx napi build --release --platform --target ${{ matrix.target }} --cross-compile
      - name: Upload node binding artifact
        uses: actions/upload-artifact@v6
        with:
          name: node-bindings-${{ matrix.target }}
          path: crates/node/seonbi.*.node
          if-no-files-found: error

  publish-node:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Set version
        working-directory: crates/node
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - name: Download all node binding artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: node-bindings-*
          path: crates/node/artifacts
          merge-multiple: true
      - name: Install JS dependencies
        working-directory: crates/node
        run: npm install
      - name: Create platform package directories
        working-directory: crates/node
        run: npx napi create-npm-dirs
      - name: Collect node artifacts into platform packages
        working-directory: crates/node
        run: npx napi artifacts
      - name: Prepare npm packages
        working-directory: crates/node
        run: npx napi prepublish -t npm --no-gh-release --skip-optional-publish
      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" == *-alpha.* ]]; then echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-beta.* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-rc.* ]]; then echo "tag=rc" >> "$GITHUB_OUTPUT"
          else echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      # - name: Publish main package
      #   Temporarily disabled.
      #   working-directory: crates/node
      #   run: npm publish --ignore-scripts --access public --tag ${{ steps.npm-tag.outputs.tag }}
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish platform packages
        working-directory: crates/node
        run: |
          shopt -s nullglob
          platform_dirs=(npm/*/)
          if (( ${#platform_dirs[@]} == 0 )); then
            echo "No platform packages found under crates/node/npm; skipping."
            exit 0
          fi

          for dir in "${platform_dirs[@]}"; do
            cd "$dir"
            npm publish --ignore-scripts --access public --tag ${{ steps.npm-tag.outputs.tag }}
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build wasm package
        run: wasm-pack build crates/wasm --release --target web --scope seonbi
      - name: Set version
        working-directory: crates/wasm/pkg
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" == *-alpha.* ]]; then echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-beta.* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-rc.* ]]; then echo "tag=rc" >> "$GITHUB_OUTPUT"
          else echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish wasm package
        working-directory: crates/wasm/pkg
        run: npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
